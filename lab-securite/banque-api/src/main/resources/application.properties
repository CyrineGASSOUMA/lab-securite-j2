spring.application.name=banque-api

# Base H2 en mémoire, recréée à chaque démarrage (données : data.sql)
spring.datasource.url=jdbc:h2:mem:banque;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Erreurs au format RFC 9457 (Problem Details)
spring.mvc.problemdetails.enabled=true

# Swagger derrière le proxy Codespaces
server.forward-headers-strategy=framework
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.operationsSorter=method

